<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Roller</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1e1b; --muted: #6b6a64; --accent: #2f6f4f; --accent-text: #ffffff; --border: #dcdad2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1b19; --card: #262623; --text: #f1f0ea; --muted: #a3a29a; --accent: #6fbf94; --accent-text: #11201a; --border: #3a3a36; }
  }
  :root[data-theme="dark"] { --bg: #1b1b19; --card: #262623; --text: #f1f0ea; --muted: #a3a29a; --accent: #6fbf94; --accent-text: #11201a; --border: #3a3a36; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 40px; text-align: center; max-width: 90%; }
  h1 { font-size: 1.3rem; margin: 0 0 20px; }
  #result { font-size: 5rem; font-weight: 700; width: 140px; height: 140px; line-height: 140px; margin: 0 auto 24px; border: 2px solid var(--border); border-radius: 20px; }
  button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 12px 28px; font-size: 1rem; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  p { color: var(--muted); margin: 16px 0 0; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Dice Roller</h1>
    <div id="result">?</div>
    <button id="roll">Roll the dice</button>
    <p id="count">Not rolled yet</p>
  </div>
<script>
  var rolls = 0;
  var btn = document.getElementById("roll");
  var result = document.getElementById("result");
  btn.addEventListener("click", function () {
    btn.disabled = true;
    result.style.fontSize = "1.6rem";
    result.textContent = "Rolling...";
    var delay = 1000 + Math.random() * 1000; // 1 to 2 seconds
    setTimeout(function () {
      var n = Math.floor(Math.random() * 6) + 1; // 1 to 6, both included
      rolls++;
      result.style.fontSize = "";
      result.textContent = n;
      document.getElementById("count").textContent = "Rolls so far: " + rolls;
      btn.disabled = false;
    }, delay);
  });
</script>
</body>
</html>
